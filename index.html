<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тест</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Georgia, "Times New Roman", serif;
      color: #e7d9d4;
      background: #090707;
    }

    body {
      position: relative;
      box-sizing: border-box;
      min-height: 100vh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 18% 22%, rgb(111 17 20 / 44%), transparent 31%),
        radial-gradient(ellipse at 82% 68%, rgb(83 14 17 / 48%), transparent 35%),
        radial-gradient(ellipse at 50% 48%, #211313 0, #100b0b 48%, #080707 100%);
    }

    body::before {
      position: fixed;
      z-index: -1;
      inset: 0;
      background:
        repeating-linear-gradient(117deg, transparent 0 31px, rgb(255 235 220 / 2%) 32px, transparent 34px 63px),
        repeating-radial-gradient(ellipse at 25% 35%, transparent 0 18px, rgb(0 0 0 / 15%) 20px 22px, transparent 24px 39px),
        radial-gradient(ellipse at 50% 50%, transparent 24%, rgb(0 0 0 / 70%) 100%);
      content: "";
      pointer-events: none;
    }

    body > * {
      position: relative;
    }

    [hidden] {
      display: none !important;
    }

    h1,
    h2,
    h3 {
      font-family: Impact, Haettenschweiler, "Arial Black", fantasy;
      text-transform: uppercase;
    }

    .panel {
      min-width: 0;
      min-height: calc(100vh - 48px);
      padding: 20px;
      border: 1px solid #542326;
      background: linear-gradient(145deg, rgb(25 16 16 / 96%), rgb(9 8 8 / 98%));
      box-shadow: 0 18px 70px rgb(0 0 0 / 55%), inset 0 0 36px rgb(93 11 19 / 12%);
    }

    #test-screen {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: flex;
      box-sizing: border-box;
      min-height: 0;
      flex-direction: column;
      padding: 16px;
    }

    button {
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #8e3035;
      color: #f2e7df;
      background: linear-gradient(180deg, #58191e, #260e11);
      font: 600 15px Georgia, "Times New Roman", serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgb(0 0 0 / 40%), inset 0 1px rgb(255 255 255 / 9%);
      transition: background-color .18s ease, border-color .18s ease, transform .18s ease;
    }

    button:hover {
      transform: translateY(-2px);
      border-color: #d65b60;
      background: linear-gradient(180deg, #81242a, #3c1015);
    }

    .menu {
      display: flex;
      min-height: calc(100vh - 48px);
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .menu-kicker,
    .menu-tagline {
      margin: 0;
      color: #b6a19a;
      font: 11px/1.5 Georgia, "Times New Roman", serif;
      letter-spacing: .55em;
      text-transform: uppercase;
    }

    .menu-kicker {
      margin-top: 18px;
    }

    .menu-tagline {
      margin-bottom: 20px;
    }

    .menu h1 {
      position: relative;
      width: 100%;
      margin: auto 0 20px;
      color: #e5d8d2;
      font-family: Impact, Haettenschweiler, "Arial Black", fantasy;
      font-size: clamp(2.2rem, 8vw, 6.5rem);
      font-weight: 900;
      letter-spacing: -.09em;
      line-height: .83;
      overflow-wrap: anywhere;
      text-align: center;
      text-shadow: -2px -1px #827674, 0 5px #4e0c11, 0 0 22px #a31b22;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #e9dcd5;
      filter: contrast(1.3);
      transform: skewX(-4deg) scaleX(.91);
    }

    .menu h1::after {
      position: absolute;
      inset: 0;
      overflow: hidden;
      color: transparent;
      content: attr(data-title);
      clip-path: polygon(0 16%, 7% 22%, 11% 3%, 16% 20%, 22% 11%, 27% 26%, 34% 8%, 39% 20%, 46% 0, 51% 17%, 58% 7%, 64% 23%, 70% 4%, 77% 21%, 82% 9%, 88% 24%, 94% 5%, 100% 17%, 100% 36%, 92% 31%, 86% 44%, 78% 32%, 71% 47%, 65% 34%, 57% 47%, 49% 35%, 43% 49%, 35% 33%, 28% 46%, 21% 31%, 14% 45%, 8% 32%, 0 42%);
      filter: drop-shadow(2px 3px #4d070d);
      transform: translate(2px, -2px);
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px #f4e7e0;
    }

    .menu-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 13px;
      margin: 0 auto;
    }

    .menu-actions button {
      min-width: 260px;
      padding: 15px 22px;
      font-size: 16px;
      letter-spacing: .16em;
    }

    #preview {
      box-sizing: border-box;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      margin-top: 12px;
      border: 1px solid #542326;
      background: #0c0909;
    }

    dialog {
      width: min(440px, calc(100% - 40px));
      padding: 24px;
      border: 1px solid #813238;
      color: #e7d9d4;
      background: linear-gradient(145deg, #211415, #0d090a);
      box-shadow: 0 20px 80px rgb(0 0 0 / 75%);
    }

    dialog::backdrop {
      background: rgb(4 2 3 / 82%);
    }

    #settings-dialog {
      width: min(820px, calc(100% - 32px));
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .category-browser-label {
      display: block;
      margin-bottom: 8px;
      color: #d7c6bf;
    }

    .category-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }

    #category-search {
      box-sizing: border-box;
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid #684044;
      color: #f0e7e2;
      background: #100b0c;
      font: inherit;
    }

    .category-selection-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-selection-actions button {
      min-height: 42px;
      padding: 8px 12px;
      font-size: 12px;
      letter-spacing: .04em;
    }

    .category-groups {
      display: grid;
      gap: 10px;
    }

    .category-group {
      overflow: hidden;
      border: 1px solid #542326;
      background: linear-gradient(145deg, rgb(25 16 16 / 96%), rgb(9 8 8 / 98%));
    }

    .category-group-header {
      display: flex;
      align-items: stretch;
      gap: 10px;
      padding: 8px;
      background: rgb(78 12 17 / 25%);
    }

    .category-group-toggle {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 9px 12px;
      border-color: transparent;
      background: transparent;
      letter-spacing: .04em;
      text-align: left;
    }

    .category-group-toggle::before {
      color: #d65b60;
      content: "+";
      font-size: 20px;
      line-height: 1;
    }

    .category-group-toggle[aria-expanded="true"]::before {
      content: "-";
    }

    .category-group-count {
      flex: 0 0 auto;
      align-self: center;
      color: #b6a19a;
      font-size: 12px;
    }

    .topic-choice {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid #684044;
      color: #d7c6bf;
      background: #160e0f;
      font-size: 12px;
      cursor: pointer;
    }

    .topic-choice input[type="checkbox"],
    .subcategory-choice input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #b53640;
    }

    .category-items {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
      gap: 10px;
      padding: 10px;
    }

    .category-items[hidden] {
      display: none;
    }

    .category-setting {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
      border: 1px solid #542326;
      background: linear-gradient(145deg, rgb(25 16 16 / 96%), rgb(9 8 8 / 98%));
    }

    .subcategory-choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.4;
      cursor: pointer;
    }

    .category-count {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #b6a19a;
      font-size: 13px;
    }

    .category-count input[type="number"] {
      box-sizing: border-box;
      width: 100px;
      padding: 8px;
      border: 1px solid #684044;
      color: #f0e7e2;
      background: #100b0c;
      font: inherit;
    }

    .category-count input:disabled {
      opacity: .45;
    }

    .category-selection {
      margin: 12px 0;
      color: #b6a19a;
      font-size: 13px;
    }

    .menu-selection {
      margin: 10px 0 0;
      color: #b6a19a;
      font-size: 13px;
      text-align: center;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .settings-actions button:first-child {
      color: #e7d9d4;
      background: #211719;
    }

    .question-form {
      display: grid;
      gap: 14px;
    }

    .question-form label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    .question-form input,
    .question-form select,
    .question-form textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      border: 1px solid #684044;
      color: #f0e7e2;
      background: #100b0c;
      font: 15px Georgia, "Times New Roman", serif;
    }

    .question-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .options-editor {
      display: grid;
      gap: 8px;
    }

    .options-editor h3 {
      margin: 0;
    }

    .option-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }

    .option-row input[type="radio"],
    .option-row input[type="checkbox"] {
      width: auto;
    }

    .option-row button,
    #add-option {
      padding: 7px 10px;
    }

    #question-error {
      margin: 0;
      color: #ff7777;
    }

    #settings-error,
    #menu-error {
      color: #ff7777;
    }

    #menu-error {
      margin: 0 0 16px;
      text-align: center;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px 12px;
      }

      .category-toolbar {
        grid-template-columns: 1fr;
      }

      .category-selection-actions {
        width: 100%;
      }

      .category-selection-actions button {
        flex: 1 1 auto;
      }

      .category-group-header {
        flex-wrap: wrap;
      }

      .category-group-toggle {
        flex-basis: calc(100% - 110px);
      }

      .topic-choice {
        flex: 1 1 auto;
        justify-content: center;
      }

      .menu {
        min-height: calc(100vh - 32px);
      }

      .menu-kicker,
      .menu-tagline {
        letter-spacing: .32em;
      }

      .menu-actions,
      .menu-actions button {
        width: 100%;
      }

      .option-row {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .option-row button {
        grid-column: 2;
        justify-self: end;
      }
    }

  </style>
</head>
<body>
  <main id="menu" class="menu">
    <p class="menu-kicker">Тест · хоррор-издание</p>
    <h1 id="menu-title"></h1>
    <div class="menu-actions">
      <button id="start-button" type="button">Начать тест</button>
      <button id="settings-button" type="button">Настройки</button>
      <button id="create-question-button" type="button">Создать свой вопрос</button>
    </div>
    <p id="menu-selection" class="menu-selection" aria-live="polite"></p>
    <p id="menu-error" role="alert"></p>
    <p class="menu-tagline">Проверь свои знания</p>
  </main>

  <section id="test-screen" class="panel" hidden>
    <button id="back-button" type="button">В меню</button>
    <iframe id="preview" title="Тест"></iframe>
  </section>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <h2 id="settings-title">Настройки теста</h2>
      <p>Выберите несколько категорий из разных тем или найдите их по названию.</p>
      <section class="category-browser" aria-label="Выбор категорий теста">
        <label class="category-browser-label" for="category-search">Поиск категорий</label>
        <div class="category-toolbar">
          <input id="category-search" type="search" placeholder="Например: география, CSS, история">
          <div class="category-selection-actions">
            <button id="select-all-categories" type="button">Выбрать всё</button>
            <button id="clear-categories" type="button">Снять всё</button>
          </div>
        </div>
        <p id="category-selection" class="category-selection" aria-live="polite"></p>
        <div id="category-groups" class="category-groups"></div>
      </section>
      <p id="settings-error" role="alert"></p>
      <div class="settings-actions">
        <button id="cancel-settings" type="button">Отмена</button>
        <button type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="question-dialog" aria-labelledby="question-dialog-title">
    <form id="question-form" class="question-form">
      <h2 id="question-dialog-title">Новый вопрос</h2>
      <label for="question-category">Категория</label>
      <input id="question-category" name="category" list="question-categories" required>
      <datalist id="question-categories"></datalist>
      <label for="question-type">Тип ответа</label>
      <select id="question-type" name="type">
        <option value="r">Один правильный ответ</option>
        <option value="c">Несколько правильных ответов</option>
        <option value="t">Текстовый ответ</option>
      </select>
      <label for="question-text">Текст вопроса</label>
      <textarea id="question-text" name="text" required></textarea>
      <section id="options-section" class="options-editor">
        <h3>Варианты ответа</h3>
        <p>Отметьте правильный вариант флажком слева.</p>
        <div id="question-options"></div>
        <button id="add-option" type="button">Добавить вариант</button>
      </section>
      <label id="answer-section" for="question-answer" hidden>
        Правильный ответ
        <input id="question-answer" name="answer">
      </label>
      <p id="question-error" role="alert"></p>
      <div class="settings-actions">
        <button id="cancel-question" type="button">Отмена</button>
        <button type="submit">Сохранить вопрос</button>
      </div>
    </form>
  </dialog>

  <script src="question-bank.js"></script>
  <script>
    "use strict";

    const preview = document.querySelector("#preview");
    const menu = document.querySelector("#menu");
    const menuError = document.querySelector("#menu-error");
    const testScreen = document.querySelector("#test-screen");
    const settingsDialog = document.querySelector("#settings-dialog");
    const settingsForm = document.querySelector("#settings-form");
    const settingsError = document.querySelector("#settings-error");
    const questionDialog = document.querySelector("#question-dialog");
    const questionForm = document.querySelector("#question-form");
    const questionType = document.querySelector("#question-type");
    const questionOptions = document.querySelector("#question-options");
    const questionError = document.querySelector("#question-error");
    const menuSelection = document.querySelector("#menu-selection");
    const categorySearch = document.querySelector("#category-search");
    const selectAllCategories = document.querySelector("#select-all-categories");
    const clearCategories = document.querySelector("#clear-categories");
    const categoryGroupsContainer = document.querySelector("#category-groups");
    const categorySelection = document.querySelector("#category-selection");
    let questionCounts = { ...window.questionBank.questionsPerCategory };
    let selectedCategories = null;
    let settingsSelectedCategories = [];
    let expandedTopics = {};
    let settingsDraftCounts = null;

    const testName = "QuizdrvzbrdDaunteamsFantasmagoricalPseudoQuasiHyperboloidExistentialBureaucraticTournament";
    window.questionBank.title = testName;
    window.questionBank.heading = testName;
    document.title = testName;
    const menuTitle = document.querySelector("#menu-title");
    menuTitle.textContent = window.questionBank.heading;
    menuTitle.dataset.title = window.questionBank.heading;
    menuTitle.setAttribute("aria-label", window.questionBank.heading);

    const customQuestionsStorageKey = "quiz-custom-questions";

    function readCustomQuestions() {
      const saved = localStorage.getItem(customQuestionsStorageKey);
      if (!saved) return [];
      const questions = JSON.parse(saved);
      if (!Array.isArray(questions)) {
        throw new Error("Сохраненные пользовательские вопросы имеют неверный формат.");
      }
      return questions;
    }

    function getEffectiveBank() {
      const bank = {
        ...window.questionBank,
        categories: Object.fromEntries(
          Object.entries(window.questionBank.categories).map(([category, questions]) => [category, questions.slice()])
        )
      };
      readCustomQuestions().forEach(({ category, question }) => {
        if (typeof category !== "string" || !category.trim() || !question || typeof question.text !== "string") {
          throw new Error("В сохраненных пользовательских вопросах найдена некорректная запись.");
        }
        if (!bank.categories[category]) bank.categories[category] = [];
        bank.categories[category].push(question);
      });
      return bank;
    }

    function getCategoryGroups(bank) {
      const groups = new Map();
      Object.keys(bank.categories).forEach((category) => {
        const separator = category.indexOf(" / ");
        const topic = separator === -1 ? category : category.slice(0, separator);
        const subcategory = separator === -1 ? null : category.slice(separator + 3);
        if (!groups.has(topic)) groups.set(topic, []);
        groups.get(topic).push({ category, subcategory });
      });
      return groups;
    }

    function getScopedCategories(bank, selected) {
      const categories = Object.keys(bank.categories);
      if (selected === null) return categories;
      const selectedSet = new Set(selected);
      return categories.filter((category) => selectedSet.has(category));
    }

    function getVisibleCategoryGroups(bank, query) {
      const normalizedQuery = query.trim().toLocaleLowerCase();
      return Array.from(getCategoryGroups(bank).entries()).map(([topic, categories]) => {
        const topicMatches = topic.toLocaleLowerCase().includes(normalizedQuery);
        const matches = topicMatches
          ? categories
          : categories.filter(({ category, subcategory }) =>
            `${category} ${subcategory || ""}`.toLocaleLowerCase().includes(normalizedQuery));
        return { topic, categories, matches };
      }).filter(({ matches }) => matches.length > 0);
    }

    function updateMenuSelection() {
      try {
        const bank = getEffectiveBank();
        const allCategories = Object.keys(bank.categories);
        const categories = getScopedCategories(bank, selectedCategories);
        const questionTotal = categories.reduce((total, category) => {
          const configured = questionCounts[category] ?? bank.questionsPerCategory[category] ?? 1;
          return total + Math.min(configured, bank.categories[category].length);
        }, 0);
        const scope = categories.length === allCategories.length
          ? "все темы"
          : categories.length === 1
            ? `категория «${categories[0]}»`
            : `${categories.length} ${categories.length < 5 ? "категории" : "категорий"}`;
        menuSelection.textContent = `Выбран тест: ${scope}. Вопросов: ${questionTotal}.`;
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        menuError.textContent = error.message;
      }
    }

    function rememberSettingsDraftCounts() {
      if (!settingsDraftCounts) return;
      categoryGroupsContainer.querySelectorAll('input[type="number"]').forEach((input) => {
        settingsDraftCounts[input.name] = input.value;
      });
    }

    function renderCategoryBrowser() {
      categoryGroupsContainer.replaceChildren();
      let bank;
      try {
        bank = getEffectiveBank();
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        settingsError.textContent = error.message;
        return;
      }

      const allCategories = Object.keys(bank.categories);
      const query = categorySearch.value.trim();
      const visibleGroups = getVisibleCategoryGroups(bank, query);
      const selected = new Set(settingsSelectedCategories);
      selectAllCategories.textContent = query ? "Выбрать найденное" : "Выбрать всё";
      clearCategories.textContent = query ? "Снять найденное" : "Снять всё";
      categorySelection.textContent = `Выбрано категорий: ${selected.size} из ${allCategories.length}.`;

      if (visibleGroups.length === 0) {
        const empty = document.createElement("p");
        empty.className = "category-selection";
        empty.textContent = "Категории по запросу не найдены.";
        categoryGroupsContainer.appendChild(empty);
        return;
      }

      visibleGroups.forEach(({ topic, categories, matches }, index) => {
        const group = document.createElement("section");
        group.className = "category-group";
        const header = document.createElement("div");
        header.className = "category-group-header";
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "category-group-toggle";
        toggle.textContent = topic;
        const itemsId = `category-items-${index}`;
        toggle.setAttribute("aria-controls", itemsId);
        const items = document.createElement("div");
        items.id = itemsId;
        items.className = "category-items";
        const expanded = Boolean(query) || expandedTopics[topic] === true;
        toggle.setAttribute("aria-expanded", String(expanded));
        items.hidden = !expanded;
        toggle.addEventListener("click", () => {
          const nextExpanded = toggle.getAttribute("aria-expanded") !== "true";
          toggle.setAttribute("aria-expanded", String(nextExpanded));
          items.hidden = !nextExpanded;
          expandedTopics[topic] = nextExpanded;
        });

        const selectedCount = categories.filter(({ category }) => selected.has(category)).length;
        const topicChoice = document.createElement("label");
        topicChoice.className = "topic-choice";
        const topicCheckbox = document.createElement("input");
        topicCheckbox.type = "checkbox";
        topicCheckbox.checked = selectedCount === categories.length;
        topicCheckbox.indeterminate = selectedCount > 0 && selectedCount < categories.length;
        topicCheckbox.setAttribute("aria-label", `Выбрать все категории темы ${topic}`);
        const topicText = document.createElement("span");
        topicText.textContent = "Вся тема";
        topicChoice.append(topicCheckbox, topicText);
        const topicCount = document.createElement("span");
        topicCount.className = "category-group-count";
        topicCount.textContent = `${selectedCount}/${categories.length}`;
        topicCheckbox.addEventListener("change", () => {
          rememberSettingsDraftCounts();
          const selectedSet = new Set(settingsSelectedCategories);
          categories.forEach(({ category }) => {
            if (topicCheckbox.checked) selectedSet.add(category);
            else selectedSet.delete(category);
          });
          settingsSelectedCategories = allCategories.filter((category) => selectedSet.has(category));
          renderCategoryBrowser();
        });
        header.append(toggle, topicCount, topicChoice);
        group.appendChild(header);

        matches.forEach(({ category, subcategory }) => {
          const isSelected = selected.has(category);
          const card = document.createElement("div");
          card.className = "category-setting";
          const choice = document.createElement("label");
          choice.className = "subcategory-choice";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = isSelected;
          checkbox.setAttribute("aria-label", `Выбрать категорию ${category}`);
          const name = document.createElement("span");
          name.textContent = subcategory || category;
          choice.append(checkbox, name);
          checkbox.addEventListener("change", () => {
            rememberSettingsDraftCounts();
            const selectedSet = new Set(settingsSelectedCategories);
            if (checkbox.checked) selectedSet.add(category);
            else selectedSet.delete(category);
            settingsSelectedCategories = allCategories.filter((item) => selectedSet.has(item));
            renderCategoryBrowser();
          });

          const countLabel = document.createElement("label");
          countLabel.className = "category-count";
          const countName = document.createElement("span");
          countName.textContent = "Вопросов в тесте";
          const input = document.createElement("input");
          input.type = "number";
          input.name = category;
          input.min = "0";
          input.step = "1";
          input.required = isSelected;
          input.disabled = !isSelected;
          const draftCount = settingsDraftCounts[category]
            ?? questionCounts[category]
            ?? bank.questionsPerCategory[category]
            ?? 1;
          settingsDraftCounts[category] = String(draftCount);
          input.value = String(draftCount);
          input.setAttribute("aria-label", `Количество вопросов категории ${category}`);
          input.addEventListener("input", () => {
            settingsDraftCounts[category] = input.value;
          });
          countLabel.append(countName, input);
          card.append(choice, countLabel);
          items.appendChild(card);
        });

        group.appendChild(items);
        categoryGroupsContainer.appendChild(group);
      });
    }

    function showSettings() {
      settingsError.textContent = "";
      let bank;
      try {
        bank = getEffectiveBank();
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        settingsError.textContent = error.message;
        settingsDialog.showModal();
        return;
      }
      const categories = Object.keys(bank.categories);
      settingsSelectedCategories = selectedCategories === null
        ? categories.slice()
        : categories.filter((category) => selectedCategories.includes(category));
      settingsDraftCounts = { ...questionCounts };
      expandedTopics = {};
      categorySearch.value = "";
      renderCategoryBrowser();
      settingsDialog.showModal();
    }

    categorySearch.addEventListener("input", () => {
      rememberSettingsDraftCounts();
      renderCategoryBrowser();
    });

    function updateVisibleCategorySelection(select) {
      rememberSettingsDraftCounts();
      let bank;
      try {
        bank = getEffectiveBank();
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        settingsError.textContent = error.message;
        return;
      }
      const matchingCategories = getVisibleCategoryGroups(bank, categorySearch.value)
        .flatMap(({ matches }) => matches.map(({ category }) => category));
      const selectedSet = new Set(settingsSelectedCategories);
      matchingCategories.forEach((category) => {
        if (select) selectedSet.add(category);
        else selectedSet.delete(category);
      });
      settingsSelectedCategories = Object.keys(bank.categories).filter((category) => selectedSet.has(category));
      renderCategoryBrowser();
    }

    selectAllCategories.addEventListener("click", () => updateVisibleCategorySelection(true));
    clearCategories.addEventListener("click", () => updateVisibleCategorySelection(false));

    document.querySelector("#settings-button").addEventListener("click", showSettings);
    document.querySelector("#cancel-settings").addEventListener("click", () => settingsDialog.close());

    settingsForm.addEventListener("submit", (event) => {
      event.preventDefault();
      rememberSettingsDraftCounts();
      const newCounts = { ...questionCounts };
      const selectedSet = new Set(settingsSelectedCategories);
      for (const [category, value] of Object.entries(settingsDraftCounts)) {
        if (!selectedSet.has(category)) continue;
        const count = Number(value);
        if (!Number.isInteger(count) || count < 0) {
          settingsError.textContent = `Для категории "${category}" укажите неотрицательное целое число.`;
          return;
        }
        newCounts[category] = count;
      }
      let bank;
      try {
        bank = getEffectiveBank();
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        settingsError.textContent = error.message;
        return;
      }
      const scopeCategories = getScopedCategories(bank, settingsSelectedCategories);
      const total = scopeCategories.reduce((sum, category) => {
        return sum + Math.min(newCounts[category], bank.categories[category].length);
      }, 0);
      if (total === 0) {
        settingsError.textContent = "Выберите хотя бы одну категорию и один вопрос.";
        return;
      }
      questionCounts = newCounts;
      selectedCategories = settingsSelectedCategories.slice();
      settingsDraftCounts = null;
      updateMenuSelection();
      settingsDialog.close();
    });

    updateMenuSelection();

    function addOptionRow(text, correct) {
      const row = document.createElement("div");
      row.className = "option-row";
      const correctInput = document.createElement("input");
      correctInput.type = questionType.value === "r" ? "radio" : "checkbox";
      correctInput.name = "correct-option";
      correctInput.checked = correct;
      correctInput.setAttribute("aria-label", "Правильный вариант");
      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.required = true;
      textInput.placeholder = "Текст варианта";
      textInput.value = text;
      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.textContent = "Удалить";
      removeButton.setAttribute("aria-label", "Удалить вариант ответа");
      removeButton.addEventListener("click", () => row.remove());
      row.append(correctInput, textInput, removeButton);
      questionOptions.appendChild(row);
    }

    function updateQuestionType() {
      const isTextAnswer = questionType.value === "t";
      document.querySelector("#options-section").hidden = isTextAnswer;
      document.querySelector("#answer-section").hidden = !isTextAnswer;
      questionOptions.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach((input) => {
        input.type = questionType.value === "r" ? "radio" : "checkbox";
      });
    }

    document.querySelector("#create-question-button").addEventListener("click", () => {
      questionForm.reset();
      questionOptions.replaceChildren();
      questionError.textContent = "";
      const categoryList = document.querySelector("#question-categories");
      categoryList.replaceChildren();
      let bank;
      try {
        bank = getEffectiveBank();
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        menuError.textContent = error.message;
        return;
      }
      Object.keys(bank.categories).forEach((category) => {
        const option = document.createElement("option");
        option.value = category;
        categoryList.appendChild(option);
      });
      questionType.value = "r";
      addOptionRow("", false);
      addOptionRow("", false);
      updateQuestionType();
      questionDialog.showModal();
    });

    document.querySelector("#cancel-question").addEventListener("click", () => questionDialog.close());
    document.querySelector("#add-option").addEventListener("click", () => addOptionRow("", false));
    questionType.addEventListener("change", updateQuestionType);

    questionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      questionError.textContent = "";
      const category = questionForm.elements.namedItem("category").value.trim();
      const type = questionType.value;
      const text = questionForm.elements.namedItem("text").value.trim();
      if (!category || !text) {
        questionError.textContent = "Укажите категорию и текст вопроса.";
        return;
      }

      let question;
      if (type === "t") {
        const answer = questionForm.elements.namedItem("answer").value.trim();
        if (!answer) {
          questionError.textContent = "Укажите правильный текстовый ответ.";
          return;
        }
        question = { text, type, answer };
      } else {
        const rows = Array.from(questionOptions.querySelectorAll(".option-row"));
        const options = rows.map((row) => ({
          text: row.querySelector('input[type="text"]').value.trim(),
          correct: row.querySelector('input[type="radio"], input[type="checkbox"]').checked
        }));
        const correctCount = options.filter((option) => option.correct).length;
        if (options.length < 2 || options.some((option) => !option.text)) {
          questionError.textContent = "Добавьте не менее двух вариантов и заполните каждый.";
          return;
        }
        if ((type === "r" && correctCount !== 1) || (type === "c" && correctCount < 1)) {
          questionError.textContent = type === "r"
            ? "Отметьте ровно один правильный вариант."
            : "Отметьте хотя бы один правильный вариант.";
          return;
        }
        question = { text, type, options };
      }

      try {
        const savedQuestions = readCustomQuestions();
        savedQuestions.push({ category, question });
        localStorage.setItem(customQuestionsStorageKey, JSON.stringify(savedQuestions));
        if (!(category in questionCounts)) questionCounts[category] = 1;
        updateMenuSelection();
        questionDialog.close();
        menuError.textContent = `Вопрос добавлен в категорию «${category}».`;
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        questionError.textContent = `Не удалось сохранить вопрос: ${error.message}`;
      }
    });

    document.querySelector("#start-button").addEventListener("click", () => {
      menuError.textContent = "";
      try {
        const bank = getEffectiveBank();
        const availableCategories = getScopedCategories(bank, selectedCategories);
        const quiz = buildRandomizedQuiz(bank, questionCounts, availableCategories);
        preview.srcdoc = makeQuizHtml(quiz);
        menu.hidden = true;
        testScreen.hidden = false;
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        menuError.textContent = error.message;
      }
    });

    document.querySelector("#back-button").addEventListener("click", () => {
      testScreen.hidden = true;
      menu.hidden = false;
    });

    function shuffle(items) {
      const shuffled = items.slice();
      for (let index = shuffled.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function buildRandomizedQuiz(bank, counts, selectedCategories) {
      if (!bank || !bank.categories || !bank.questionsPerCategory) {
        throw new Error("Банк вопросов должен содержать категории и количество вопросов для каждой категории.");
      }

      const questions = [];
      const categories = selectedCategories || Object.keys(bank.categories);
      if (categories.length === 0) throw new Error("В банке вопросов нет категорий.");

      categories.forEach((category) => {
        const count = counts[category] ?? bank.questionsPerCategory[category] ?? 1;
        const categoryQuestions = bank.categories[category];
        if (!Number.isInteger(count) || count < 0) {
          throw new Error(`Для категории "${category}" задайте неотрицательное целое число вопросов.`);
        }
        if (!Array.isArray(categoryQuestions)) throw new Error(`В категории "${category}" нет списка вопросов.`);

        shuffle(categoryQuestions).slice(0, Math.min(count, categoryQuestions.length)).forEach((question) => {
          if (!question || typeof question.text !== "string" || !["r", "c", "t"].includes(question.type)) {
            throw new Error(`В категории "${category}" найден вопрос с некорректным текстом или типом.`);
          }
          if (question.type === "t") {
            if (typeof question.answer !== "string" || !question.answer.trim()) {
              throw new Error(`Вопрос "${question.text}" должен содержать текстовый ответ.`);
            }
            questions.push({ ...question, category });
            return;
          }

          if (!Array.isArray(question.options) || question.options.length === 0) {
            throw new Error(`Вопрос "${question.text}" должен содержать варианты ответа.`);
          }
          const correctCount = question.options.filter((option) => option.correct === true).length;
          if ((question.type === "r" && correctCount !== 1) || (question.type === "c" && correctCount < 1)) {
            throw new Error(`Проверьте количество правильных ответов в вопросе "${question.text}".`);
          }
          questions.push({ ...question, options: shuffle(question.options), category });
        });
      });

      if (questions.length === 0) throw new Error("Выберите хотя бы один вопрос для теста.");
      return {
        title: bank.title,
        heading: bank.heading,
        style: bank.style,
        questions
      };
    }

    function makeQuizHtml(quiz) {
      const json = JSON.stringify(quiz).replace(/</g, "\\u003c");
      return `<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body{width:100%;max-width:none;min-height:100vh;box-sizing:border-box;margin:0;padding:clamp(20px,4vw,48px);font:16px/1.5 Georgia,"Times New Roman",serif;color:#e7d9d4;background:radial-gradient(ellipse at 18% 22%,rgb(111 17 20 / 44%),transparent 31%),radial-gradient(ellipse at 82% 68%,rgb(83 14 17 / 48%),transparent 35%),radial-gradient(ellipse at 50% 48%,#211313 0,#100b0b 48%,#080707 100%)}
    .quiz-title{position:relative;margin:0 0 clamp(20px,4vh,42px);color:#e5d8d2;font-family:Impact,Haettenschweiler,"Arial Black",fantasy;font-size:clamp(2.2rem,5vw,4.5rem);font-weight:900;letter-spacing:-.07em;line-height:.9;text-transform:uppercase;-webkit-text-stroke:1px #e9dcd5;text-shadow:-2px -1px #827674,0 5px #4e0c11,0 0 22px #a31b22;filter:contrast(1.3);transform:skewX(-4deg) scaleX(.91);overflow-wrap:anywhere}
    .quiz-title::after{position:absolute;inset:0;overflow:hidden;color:transparent;content:attr(data-title);clip-path:polygon(0 16%,7% 22%,11% 3%,16% 20%,22% 11%,27% 26%,34% 8%,39% 20%,46% 0,51% 17%,58% 7%,64% 23%,70% 4%,77% 21%,82% 9%,88% 24%,94% 5%,100% 17%,100% 36%,92% 31%,86% 44%,78% 32%,71% 47%,65% 34%,57% 47%,49% 35%,43% 49%,35% 33%,28% 46%,21% 31%,14% 45%,8% 32%,0 42%);filter:drop-shadow(2px 3px #4d070d);transform:translate(2px,-2px);-webkit-text-fill-color:transparent;-webkit-text-stroke:1px #f4e7e0}
    fieldset{margin:16px 0;padding:16px;border:1px solid #542326;background:linear-gradient(145deg,rgb(25 16 16 / 96%),rgb(9 8 8 / 98%));box-shadow:inset 0 0 24px rgb(93 11 19 / 12%)}
    label{display:block;margin:8px 0}
    input[type=text]{box-sizing:border-box;width:100%;max-width:420px;padding:10px;border:1px solid #684044;color:#f0e7e2;background:#100b0c;font:inherit}
    button{padding:12px 18px;border:1px solid #8e3035;color:#f2e7df;background:linear-gradient(180deg,#58191e,#260e11);font:600 15px Georgia,"Times New Roman",serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
    button:hover{border-color:#d65b60;background:linear-gradient(180deg,#81242a,#3c1015)}
    #result{margin-top:24px;color:#f1d8d2;font-size:1.25rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    fieldset.question-correct{border-color:#4b9b69;box-shadow:inset 0 0 24px rgb(75 155 105 / 16%)}
    fieldset.question-incorrect{border-color:#d65b60;box-shadow:inset 0 0 24px rgb(214 91 96 / 16%)}
    #result-review{margin-top:24px;padding-top:12px;border-top:1px solid #542326}
    #result-review h2{font-size:clamp(1.4rem,3vw,2rem)}
    .result-review-list{display:grid;gap:12px;padding-left:1.5rem}
    .result-review-list li{padding:12px;border-left:3px solid #d65b60;background:rgb(78 12 17 / 25%)}
    .review-question{margin-top:0;font-weight:700}
    .review-answer{margin:6px 0}
    .quiz--compact fieldset{margin:8px 0;padding:10px}
  </style>
</head>
<body>
  <main id="quiz" class="quiz--${quiz.style}"></main>
  <script type="application/json" id="quiz-data">${json}<\/script>
  <script>
    "use strict";
    const quiz = JSON.parse(document.getElementById("quiz-data").textContent);
    document.title = quiz.title;
    const root = document.getElementById("quiz");
    const heading = document.createElement("h1");
    heading.className = "quiz-title";
    heading.textContent = quiz.heading;
    heading.dataset.title = quiz.heading;
    heading.setAttribute("aria-label", quiz.heading);
    root.appendChild(heading);
    const form = document.createElement("form");
    form.noValidate = true;
    quiz.questions.forEach((question, questionIndex) => {
      const group = document.createElement("fieldset");
      const legend = document.createElement("legend");
      legend.textContent = (questionIndex + 1) + ". " + question.text;
      group.appendChild(legend);
      if (question.type === "t") {
        const input = document.createElement("input");
        input.type = "text";
        input.name = "question-" + questionIndex;
        input.autocomplete = "off";
        input.setAttribute("aria-label", question.text);
        group.appendChild(input);
      } else {
        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = question.type === "r" ? "radio" : "checkbox";
          input.name = "question-" + questionIndex;
          input.value = String(optionIndex);
          label.appendChild(input);
          label.appendChild(document.createTextNode(" " + option.text));
          group.appendChild(label);
        });
      }
      form.appendChild(group);
    });
    const submit = document.createElement("button");
    submit.type = "submit";
    submit.textContent = "Проверить ответы";
    form.appendChild(submit);
    const result = document.createElement("p");
    result.id = "result";
    result.hidden = true;
    result.setAttribute("aria-live", "polite");
    form.appendChild(result);
    const resultReview = document.createElement("section");
    resultReview.id = "result-review";
    resultReview.hidden = true;
    resultReview.setAttribute("aria-live", "polite");
    form.appendChild(resultReview);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      let correctCount = 0;
      const reviewItems = [];
      const groups = form.querySelectorAll("fieldset");
      quiz.questions.forEach((question, questionIndex) => {
        const group = groups[questionIndex];
        let isCorrect;
        let userAnswer;
        let correctAnswer;
        if (question.type === "t") {
          const input = form.elements.namedItem("question-" + questionIndex);
          userAnswer = input.value.trim() || "Нет ответа";
          correctAnswer = question.answer;
          isCorrect = input.value.trim().toLocaleLowerCase() === question.answer.trim().toLocaleLowerCase();
        } else {
          const selected = Array.from(form.querySelectorAll('[name="question-' + questionIndex + '"]:checked'))
            .map((input) => Number(input.value))
            .sort((a, b) => a - b);
          const expected = question.options
            .map((option, optionIndex) => option.correct ? optionIndex : -1)
            .filter((optionIndex) => optionIndex !== -1);
          const selectedSet = new Set(selected);
          const expectedSet = new Set(expected);
          const selectedOptions = question.options
            .filter((option, optionIndex) => selectedSet.has(optionIndex))
            .map((option) => option.text);
          const correctOptions = question.options
            .filter((option, optionIndex) => expectedSet.has(optionIndex))
            .map((option) => option.text);
          userAnswer = selectedOptions.length ? selectedOptions.join(", ") : "Нет ответа";
          correctAnswer = correctOptions.join(", ");
          isCorrect = selected.length === expected.length
            && selected.every((optionIndex, index) => optionIndex === expected[index]);
        }

        group.classList.toggle("question-correct", isCorrect);
        group.classList.toggle("question-incorrect", !isCorrect);
        if (isCorrect) {
          correctCount++;
          return;
        }

        reviewItems.push({ question: question.text, userAnswer, correctAnswer });
      });
      const incorrectCount = quiz.questions.length - correctCount;
      const percentage = Math.round(correctCount / quiz.questions.length * 100);
      result.textContent = "Правильных: " + correctCount + " · Неверных: " + incorrectCount + " · Результат: " + percentage + "%";
      result.hidden = false;
      resultReview.replaceChildren();
      resultReview.hidden = false;
      const reviewHeading = document.createElement("h2");
      reviewHeading.textContent = "Разбор ошибок";
      resultReview.appendChild(reviewHeading);
      if (reviewItems.length === 0) {
        const success = document.createElement("p");
        success.textContent = "Ошибок нет — отлично!";
        resultReview.appendChild(success);
        result.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      const reviewList = document.createElement("ol");
      reviewList.className = "result-review-list";
      reviewItems.forEach(({ question, userAnswer, correctAnswer }) => {
        const item = document.createElement("li");
        const questionText = document.createElement("p");
        questionText.className = "review-question";
        questionText.textContent = question;
        const userAnswerText = document.createElement("p");
        userAnswerText.className = "review-answer";
        userAnswerText.textContent = "Ваш ответ: " + userAnswer;
        const correctAnswerText = document.createElement("p");
        correctAnswerText.className = "review-answer";
        correctAnswerText.textContent = "Правильный ответ: " + correctAnswer;
        item.append(questionText, userAnswerText, correctAnswerText);
        reviewList.appendChild(item);
      });
      resultReview.appendChild(reviewList);
      result.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    root.appendChild(form);
  <\/script>
</body>
</html>`;
    }

  </script>
